name: Fix Build (upstream sync + x64)

# Keeps this fork's fix branch on top of upstream and builds the patched
# version.dll whenever upstream moves.
#
# A fork does NOT receive push events for its upstream, so "upstream updated"
# has to be polled: the `schedule` trigger below does that. GitHub only runs
# scheduled workflows from the repository's DEFAULT branch, which is why this
# file must also exist on `main`. The `push` trigger covers direct pushes to
# the fix branch (the file must exist there too, hence the copy).
#
# Everything happens inside one run: sync merges upstream into the fix branch
# and pushes it, then build checks that branch out. No PAT is needed and no
# cross-workflow dispatch (a GITHUB_TOKEN push cannot start another workflow).
on:
  schedule:
    # Poll upstream a few times a day; offset minutes to avoid the top of hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      rebuild_without_sync:
        description: "Skip the upstream merge and just rebuild the current fix branch"
        type: boolean
        default: false
  push:
    branches: [fix/lnk-zero-byte]
    paths-ignore:
      - "web/**"
      - "**.md"

permissions:
  contents: write # sync pushes the merge commit into the fix branch

concurrency:
  group: fix-build
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1. sync
  # Only does work when running from the default branch (schedule / dispatch).
  # A push to the fix branch is already up to date by definition.
  sync:
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && github.event.inputs.rebuild_without_sync != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for a real merge)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream main into the fix branch when behind
        env:
          UPSTREAM: libsgh/chrome_green
          TARGET: fix/lnk-zero-byte
        run: |
          set -euo pipefail
          git config user.name  "chrome-green-fix-bot"
          git config user.email "chrome-green-fix-bot@users.noreply.github.com"
          git fetch --no-tags origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
          git fetch --no-tags "https://github.com/${UPSTREAM}.git" \
            "+refs/heads/main:refs/remotes/upstream/main"

          UP=$(git rev-parse refs/remotes/upstream/main)
          TIP=$(git rev-parse "refs/remotes/origin/${TARGET}")
          echo "upstream main : $UP"
          echo "fix branch tip: $TIP"

          if git merge-base --is-ancestor "$UP" "$TIP"; then
            echo "::notice::fix branch already contains upstream main; nothing to merge"
            exit 0
          fi

          git checkout -B "$TARGET" "$TIP"
          if ! git merge --no-ff --no-edit \
               -m "chore(sync): merge ${UPSTREAM} main@${UP:0:7} into ${TARGET}" "$UP"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            # src/version.h collides on EVERY upstream version bump: upstream
            # rewrites the RELEASE_VER_* numbers, the fork owns the "-fix"
            # suffix on the adjacent line plus a comment block. The two intents
            # compose, so resolve this one mechanically — take upstream's
            # numbers, keep the fork's suffix — instead of failing the run.
            # Any other conflicted file is a real semantic conflict and stops
            # here with the actual list.
            if [ "$CONFLICTS" != "src/version.h" ]; then
              echo "::error::Merge conflict against upstream ${UP:0:7} in: $(echo "$CONFLICTS" | tr '\n' ' ')— needs a manual rebase."
              git merge --abort
              exit 1
            fi
            echo "resolving the src/version.h number/suffix collision"
            git checkout --ours -- src/version.h   # keep the fork's "-fix" suffix
            for k in MAIN SUB FIX; do
              v=$(git show "$UP:src/version.h" \
                    | sed -n "s/^#define RELEASE_VER_${k} \([0-9][0-9]*\).*/\1/p")
              if [ -z "$v" ]; then
                echo "::error::upstream ${UP:0:7} no longer defines RELEASE_VER_${k}; src/version.h needs a manual rebase."
                git merge --abort
                exit 1
              fi
              sed -i "s/^#define RELEASE_VER_${k} [0-9][0-9]*/#define RELEASE_VER_${k} ${v}/" src/version.h
            done
            if ! grep -q '^#define RELEASE_VER_PRE_SUFFIX "-fix"' src/version.h; then
              echo "::error::the '-fix' suffix is missing after resolving src/version.h"
              git merge --abort
              exit 1
            fi
            if grep -qE '^(<<<<<<<|=======|>>>>>>>)' src/version.h; then
              echo "::error::src/version.h still has conflict markers after resolution"
              git merge --abort
              exit 1
            fi
            # Anything upstream touched in that file besides the four defines
            # would be dropped by the resolution above; refuse instead.
            EXTRA=$(git show "$UP:src/version.h" \
                      | grep -vE '^#define RELEASE_VER_(MAIN|SUB|FIX|PRE_SUFFIX) ' \
                      | grep -v '^$' \
                      | grep -vxF -f src/version.h || true)
            if [ -n "$EXTRA" ]; then
              echo "::error::upstream ${UP:0:7} changed more than the version numbers in src/version.h; needs a manual rebase."
              git merge --abort
              exit 1
            fi
            git add src/version.h
            # --no-edit reuses MERGE_MSG written by the failed merge above.
            git commit --no-edit -q
          fi

          # The patch must survive the merge. Upstream touching the same
          # regions already fails the merge above, so reaching this point means
          # a fix silently vanished (e.g. a change elsewhere in the file took
          # the function with it). Also assert the fork's self-update channel:
          # if it reverts to upstream's index the built dll would offer users
          # the unpatched release.
          if ! grep -q 'SafeShellLinkSave' src/appid.cc || \
             ! grep -q 'cg_safe_lnk_save'  src/updater_gui.c; then
            echo "::error::the .lnk fix is missing after the merge"
            exit 1
          fi
          if ! grep -q 'api.github.com/repos/hulisang/chrome_green/releases' src/update.cc; then
            echo "::error::the fork self-update channel was lost in the merge (src/update.cc)"
            exit 1
          fi

          git push origin "HEAD:refs/heads/${TARGET}"

  # --------------------------------------------------------------- 2. build
  # Runs after sync (or on a push to the fix branch, where sync is skipped).
  # x64 only: the arch the local UCRT64 build was verified against. Add more
  # entries to the matrix for x86/arm64.
  build:
    needs: [sync]
    if: ${{ always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    runs-on: windows-2025
    steps:
      - name: Checkout fix branch (latest, including a merge just pushed)
        uses: actions/checkout@v7
        with:
          ref: fix/lnk-zero-byte
          submodules: "true"
          fetch-depth: 0

      - name: Report what is being built
        shell: bash
        run: |
          echo "commit : $(git rev-parse --short HEAD)"
          echo "subject: $(git log -1 --pretty=%s)"
          grep -E '#define RELEASE_VER' src/version.h
          echo "fix markers appid  : $(grep -c 'SafeShellLinkSave\|HealTruncatedLnks' src/appid.cc)"
          echo "fix markers updater: $(grep -c 'cg_safe_lnk_save\|cg_heal_truncated' src/updater_gui.c)"
          echo "SRC_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Web Frontend
        shell: bash
        run: cd web && npm ci && npm run build && cd ..

      - name: Embed Web Content
        shell: bash
        run: node scripts/embed.mjs

      - name: Set CLANG_BIN
        shell: bash
        run: echo "CLANG_BIN=$(dirname "$(where clang-cl | head -n 1)")" >> $GITHUB_ENV

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.0"

      - name: Configure Xmake
        run: xmake f -m release -a x64 --toolchain=clang-cl --bin="${{ env.CLANG_BIN }}" --yes

      - name: Build (updater exe first, then version.dll)
        shell: bash
        run: |
          # version.dll embeds chrome_green_updater.exe as RCDATA 1001 via
          # src/updater_res.rc, which the exe target's after_build rewrites.
          # On a clean checkout the dll must not be linked before the exe.
          xmake build -r chrome_green_updater
          xmake

      - name: Verify the artifact
        shell: bash
        run: |
          set -euo pipefail
          DLL="build/release/version.dll"
          test -f "$DLL" || { echo "::error::version.dll missing"; exit 1; }
          echo "version.dll = $(stat -c%s "$DLL") bytes"

          EXPORTS=$(llvm-readobj --coff-exports "$DLL" | grep -c 'Name: ' || true)
          echo "exports = $EXPORTS"
          test "$EXPORTS" -eq 18 || { echo "::error::expected 18 exports, got $EXPORTS"; exit 1; }

          # The heal routines are static, so assert on their log strings.
          grep -aq 'appid: rebuilt truncated pinned lnk=' "$DLL" \
            || { echo "::error::donor-less heal string missing from the DLL"; exit 1; }
          grep -aq 'appid: pinned lnk already stamped, skipped' "$DLL" \
            || { echo "::error::read-before-write skip missing from the DLL"; exit 1; }

          cp "$DLL" "version-x64-${SRC_SHA}.dll"

          # The version the dll reports, used as the release tag and the zip
          # name. Read back from the binary, not from version.h, so a fork build
          # can never be published under upstream's plain "<ver>" tag.
          VER=$(grep -ao '2\.[0-9]*\.[0-9]*-fix' "$DLL" | head -1)
          test -n "$VER" || { echo "::error::no '-fix' version string in the DLL"; exit 1; }
          echo "release tag = $VER"
          echo "RELEASE_TAG=$VER" >> "$GITHUB_ENV"

      - name: Upload version.dll
        uses: actions/upload-artifact@v7
        with:
          name: version-x64-${{ env.SRC_SHA }}
          path: version-x64-${{ env.SRC_SHA }}.dll
          if-no-files-found: error

      # The zip nests version.dll under x64/ because that is the layout the
      # self-updater extracts (GetCurrentArchitectureFolder).
      - name: Package release zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkg/x64
          cp build/release/version.dll pkg/x64/version.dll
          (cd pkg && 7z a -tzip -mx=9 "../ChromeGreen_v${RELEASE_TAG}.zip" x64 >/dev/null)
          ls -l "ChromeGreen_v${RELEASE_TAG}.zip"

      # One release per version: a rebuild of the same upstream version only
      # refreshes the artifact, it does not add another release. Upstream's
      # tags are plain "2.1.0"; this fork's are "2.1.0-fix", so the two can
      # coexist and the self-updater resolves the fork's by tag.
      - name: Check whether this version is already published
        if: ${{ env.RELEASE_TAG != '' }}
        id: tagcheck
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: ${{ env.RELEASE_TAG != '' && steps.tagcheck.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: ChromeGreen_v${{ env.RELEASE_TAG }}.zip
          # Never a prerelease: the self-updater skips prerelease entries when
          # picking the newest stable tag.
          prerelease: false
          body: |
            Patch build of ChromeGreen ${{ env.RELEASE_TAG }}.

            - upstream commit: ${{ github.sha }}
            - built by: .github/workflows/fix-build.yml

            version.dll fixes the pinned .lnk being truncated to 0 bytes
            (crash-safe save + rollback, donor-less rebuild, read-before-write
            skip). Unzip and replace App/version.dll.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
